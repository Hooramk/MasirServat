name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Create temporary signing key
        run: |
          keytool -genkeypair -noprompt             -keystore masirservat-release.jks             -storepass changeit -keypass changeit             -alias masirservat             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=MasirServat,O=Hooramk,C=IR"

      - name: Align and sign APK with V1 V2 V3
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4             app/build/outputs/apk/release/app-release-unsigned.apk             MasirServat-aligned.apk
          "$BT/apksigner" sign             --ks masirservat-release.jks             --ks-pass pass:changeit             --key-pass pass:changeit             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out MasirServat-v0.3.0.apk             MasirServat-aligned.apk

      - name: Verify signature and package
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs MasirServat-v0.3.0.apk
          "$BT/aapt" dump badging MasirServat-v0.3.0.apk | head -20
          unzip -t MasirServat-v0.3.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MasirServat-APK-v0.3.0
          path: MasirServat-v0.3.0.apk
          if-no-files-found: error
          retention-days: 30
