name: Build Hooranet VPN Manager APK

concurrency:
  group: hooranet-vpn-manager-signing
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - hooranet-vpn-manager
    paths:
      - 'HooranetVPNManager/**'
      - '.github/workflows/hooranet-vpn-manager.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'HooranetVPNManager/**'
      - '.github/workflows/hooranet-vpn-manager.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preserve Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: hooranet-vpn-signing-v2

      - name: Ensure stable Android signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v               -keystore "$HOME/.android/debug.keystore"               -storepass android               -alias androiddebugkey               -keypass android               -dname "CN=Hooranet Android,O=Hooranet,C=IR"               -keyalg RSA               -keysize 2048               -validity 10000
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Use runner Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          echo "SDKMANAGER=$SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p HooranetVPNManager assembleDebug --stacktrace

      - name: Rename APK
        run: cp HooranetVPNManager/app/build/outputs/apk/debug/app-debug.apk HooranetVPNManager.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HooranetVPNManager-APK
          path: HooranetVPNManager.apk
          retention-days: 30
