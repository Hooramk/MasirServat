name: Build Unity Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/unity-build-trigger.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Unity rebuild branch
        uses: actions/checkout@v4
        with:
          ref: unity3d-rebuild
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Unity3D/Library
          key: Unity3D-Library-${{ runner.os }}-${{ hashFiles('Unity3D/Packages/**', 'Unity3D/ProjectSettings/**', 'Unity3D/Assets/**') }}
          restore-keys: |
            Unity3D-Library-${{ runner.os }}-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity3D
          unityVersion: 6000.6.3f1
          targetPlatform: Android
          buildMethod: MasirServat.Editor.AndroidBuild.Build
          buildsPath: Unity3D/Builds

      - name: Upload Unity APK
        uses: actions/upload-artifact@v4
        with:
          name: MasirServat-Unity-Android
          path: Unity3D/Builds/Android/MasirServat-Unity.apk
          if-no-files-found: error
