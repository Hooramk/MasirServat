    compileSdk 35

    defaultConfig {
        applicationId 'ir.hooranet.vpnmanager'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.2.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
