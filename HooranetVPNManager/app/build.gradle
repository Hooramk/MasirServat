plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.hooranet.vpnmanager'
    compileSdk 35

    defaultConfig {
        applicationId 'ir.hooranet.vpnmanager'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.2.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
